[package]
name = "saku-factory"
description = "Sets up a Saku allowance (contract + agent account) from one wallet call, and works out its Base address from the MPC on-chain."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Gliana-Labs/gliana-near-x402"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.6", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
